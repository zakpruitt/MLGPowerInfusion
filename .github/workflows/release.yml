name: Build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          # Major.minor comes from the .toc; the patch is the run number
          BASE=$(sed -nE 's/^## Version:[[:space:]]*([0-9]+\.[0-9]+).*/\1/p' PowerInfusionMLG.toc)
          INTERFACE=$(sed -nE 's/^## Interface:[[:space:]]*([0-9]+).*/\1/p' PowerInfusionMLG.toc | head -1)
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "interface=${INTERFACE}" >> "$GITHUB_OUTPUT"

      - name: Package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="PowerInfusionMLG-${VERSION}.zip"
          # Only what WoW loads; source art stays out of the zip
          rm -rf dist && mkdir -p dist/PowerInfusionMLG/Media
          cp PowerInfusionMLG.toc *.lua dist/PowerInfusionMLG/
          cp Media/*.tga Media/*.mp3 dist/PowerInfusionMLG/Media/
          sed -i -E "s/^## Version:.*/## Version: ${VERSION}/" dist/PowerInfusionMLG/PowerInfusionMLG.toc
          (cd dist && zip -qr "../${ZIP}" PowerInfusionMLG)
          # release.json is what WoWUp reads to pick the right asset for retail
          cat > release.json <<JSON
          {
            "releases": [
              {
                "name": "PowerInfusionMLG",
                "version": "${VERSION}",
                "filename": "${ZIP}",
                "nolib": false,
                "metadata": [
                  { "flavor": "mainline", "interface": ${{ steps.ver.outputs.interface }} }
                ]
              }
            ]
          }
          JSON
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Changes:"
            echo
            git log --no-merges --format='- %s' ${PREV:+${PREV}..}HEAD
            echo
            echo "Install or update with WoWUp: **Get Addons -> Install from URL** -> \`${{ github.server_url }}/${{ github.repository }}\`"
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "${{ steps.pkg.outputs.zip }}" release.json \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --target "$(git rev-parse HEAD)"
